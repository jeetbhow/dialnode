[package]
name = "dialnode"
version = "0.9.0"
edition = "2024"
description = "A graph-based dialogue editor for video game developers."
license = "MIT"
authors = ["Jeet Bhowmik"]

[dependencies]
anyhow = "1.0.104"
eframe = "0.37"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
trash = "5.2.9"
uuid = { version = "1.29.0", features = ["v4"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
