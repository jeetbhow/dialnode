[package]
name = "dialnode"
version = "0.9.0"
edition = "2024"
description = "A graph-based dialogue editor for video game developers."
license = "MIT"
authors = ["Jeet Bhowmik"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
eframe = "0.37"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
rfd = "0.17.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
uuid = { version = "1.29.0", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
egui_kittest = "0.37"
tempfile = "3.27.0"
